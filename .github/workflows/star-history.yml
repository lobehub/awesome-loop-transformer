name: Star history

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  record:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency: star-history
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record the current star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count)
          python3 scripts/update_star_history.py --record "$stars"
          python3 scripts/update_star_history.py --check
      - name: Save the observation
        run: |
          git add assets/star-history.csv assets/star-history.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh weekly star history"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
